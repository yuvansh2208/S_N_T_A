<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <link rel="stylesheet" href=""> -->
</head>

<body class="flex flex-col h-screen bg-gray-100">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center bg-white shadow-md">
        <!-- Sidebar Toggle Button -->
        <button id="toggleSidebar" class="p-2 rounded-lg bg-gray-200 hover:bg-gray-300">
            ☰
        </button>
        <div class="flex items-center space-x-3">
            <span id="dash_name" class="text-lg font-semibold"></span>
            <img src="generic-user-icon-9.jpg" alt="Profile Picture" class="w-10 h-10 rounded-full outline 1px solid">
        </div>
    </header>

    <!-- Sidebar (Initially Hidden) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden"></div>
    <aside id="sidebar"
        class="w-64 bg-white shadow-md h-screen p-4 fixed left-0 top-0 transform -translate-x-full transition-transform duration-300 z-50">
        <button id="closeSidebar" class="p-2 text-gray-500 hover:text-gray-800">✖</button>
        <ul class="space-y-4 mt-4">
            <li><a href="Dashboard.html" class="block p-2 bg-gray-200 rounded hover:bg-gray-300">Dashboard</a></li>
            <li><a href="#" class="block p-2 bg-gray-200 rounded hover:bg-gray-300">Notes</a></li>
            <li><a href="chat.html" class="block p-2 bg-gray-200 rounded hover:bg-gray-300">Chats</a></li>
            <li><a href="#" class="block p-2 bg-gray-200 rounded hover:bg-gray-300">Chatbots</a></li>
            <li><a href="#" class="block p-2 bg-gray-200 rounded hover:bg-gray-300">Summarize YT Videos</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-center items-center p-4">
        <div class="w-full flex items-center mt-4">
            <div class="flex-1 border-t border-gray-400 mx-4 hidden" id="left-line"></div>
            <div class="flex-1 border-t border-gray-400 mx-4 hidden" id="right-line"></div>
        </div>
    </main>

    
    <script>
        function changeColor(buttonId) {
            document.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('bg-blue-800');
                btn.classList.add('bg-blue-400');
            });
            document.getElementById(buttonId).classList.add('bg-blue-800');
        }

        // Sidebar Toggle Functionality
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const toggleSidebarButton = document.getElementById('toggleSidebar');
        const closeSidebarButton = document.getElementById('closeSidebar');

        toggleSidebarButton.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        });

        closeSidebarButton.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        });

        // Click outside sidebar to close
        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        });
    </script>

    <script type="module" src="loginpage.js"></script>
    <script type="module" src="dashboard.js"></script>

</body>

</html>
